<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{OFFLINE_TITLE}} - {{APP_NAME}}</title>
    <script>
      // Translation system - matches your 500.html implementation
      (function () {
        // Default site language - change this to set your default language
        const DEFAULT_LANGUAGE = "pl";

        const translations = {
          en: {
            offline_title: "You're Offline",
            offline_message:
              "Please check your internet connection and try again.",
            no_connection: "No Internet Connection",
            try_again: "Try Again",
            go_home: "Go Home",
          },
          pl: {
            offline_title: "Jesteś Offline",
            offline_message:
              "Sprawdź połączenie internetowe i spróbuj ponownie.",
            no_connection: "Brak połączenia internetowego",
            try_again: "Spróbuj ponownie",
            go_home: "Przejdź do strony głównej",
          },
        };

        // Function to detect user's preferred language
        function detectLanguage() {
          // Try to get language from URL query parameter (e.g., ?lang=pl)
          const urlParams = new URLSearchParams(window.location.search);
          const urlLang = urlParams.get("lang");
          if (urlLang && translations[urlLang]) {
            return urlLang;
          }

          // Check if URL path contains language indicator (e.g., /en/, /pl/)
          const path = window.location.pathname;
          for (const lang in translations) {
            // Check if path has language segment like /en/ or /pl/
            if (path.includes("/" + lang + "/")) {
              return lang;
            }
          }

          // Special case: if URL doesn't contain '/en/', default to Polish
          if (!path.includes("/en/")) {
            // If English isn't explicitly indicated, use default language
            return DEFAULT_LANGUAGE;
          }

          // Try to get language from localStorage
          const storedLang = localStorage.getItem("language");
          if (storedLang && translations[storedLang]) {
            return storedLang;
          }

          // Try to get language from browser settings
          const browserLang = navigator.language || navigator.userLanguage;
          if (browserLang) {
            const langCode = browserLang.split("-")[0];
            if (translations[langCode]) {
              return langCode;
            }
          }

          // If nothing else matches, use the default language
          return DEFAULT_LANGUAGE;
        }

        // Store the detected language
        const currentLang = detectLanguage();
        document.documentElement.lang = currentLang;

        // Function to translate the page
        function translatePage() {
          const elements = document.querySelectorAll("[data-i18n]");
          elements.forEach((element) => {
            const key = element.getAttribute("data-i18n");
            if (translations[currentLang] && translations[currentLang][key]) {
              element.textContent = translations[currentLang][key];
            }
          });
        }

        // Apply translations after DOM is loaded
        document.addEventListener("DOMContentLoaded", translatePage);

        // Language selector functions
        let activeLang = currentLang;

        // Function to update language button states
        function updateLanguageButtons() {
          const buttons = document.querySelectorAll(".lang-btn");
          buttons.forEach((btn) => {
            const btnLang = btn.textContent.toLowerCase();
            if (btnLang === activeLang) {
              btn.classList.add("active");
            } else {
              btn.classList.remove("active");
            }
          });
        }

        // Expose language change function globally
        window.changeLanguage = function (lang) {
          if (translations[lang]) {
            localStorage.setItem("language", lang);
            document.documentElement.lang = lang;
            // Update our local tracking variable
            activeLang = lang;

            // Apply translations
            const elements = document.querySelectorAll("[data-i18n]");
            elements.forEach((element) => {
              const key = element.getAttribute("data-i18n");
              if (translations[lang][key]) {
                element.textContent = translations[lang][key];
              }
            });

            // Update button states
            updateLanguageButtons();
          }
        };

        // Update language buttons after DOM is loaded
        document.addEventListener("DOMContentLoaded", function () {
          translatePage();
          updateLanguageButtons();
        });
      })();
    </script>
    <style>
      :root {
          --primary-color: {
                  {
                  THEME_COLOR
              }
          }

          ;

          --bg-color: {
                  {
                  BACKGROUND_COLOR
              }
          }

          ;
          --text-primary: #1a1a1a;
          --text-secondary: #6b7280;
          --surface: #ffffff;
          --surface-alt: #f9fafb;
          --border: #e5e7eb;
          --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
          --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
          --gradient: linear-gradient(135deg, var(--primary-color) 0%, #9466ea 100%);
      }

      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif;
          background: var(--gradient);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          line-height: 1.6;
          overflow-x: hidden;
      }

      .offline-container {
          background: var(--surface);
          backdrop-filter: blur(20px);
          border-radius: 24px;
          padding: 48px;
          max-width: 480px;
          width: 100%;
          text-align: center;
          box-shadow: var(--shadow-lg);
          border: 1px solid rgba(255, 255, 255, 0.2);
          position: relative;
          overflow: hidden;
      }

      .offline-container::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 4px;
          background: var(--gradient);
      }

      .offline-icon {
          width: 120px;
          height: 120px;
          margin: 0 auto 32px;
          background: var(--surface-alt);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
          box-shadow: var(--shadow);
          animation: float 3s ease-in-out infinite;
      }

      .offline-icon svg {
          width: 60px;
          height: 60px;
          color: var(--text-secondary);
      }

      .offline-icon::after {
          content: '';
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 2px solid var(--primary-color);
          opacity: 0.3;
          animation: pulse 2s ease-in-out infinite;
      }

      @keyframes float {

          0%,
          100% {
              transform: translateY(0px);
          }

          50% {
              transform: translateY(-10px);
          }
      }

      @keyframes pulse {
          0% {
              transform: scale(1);
              opacity: 0.3;
          }

          50% {
              transform: scale(1.05);
              opacity: 0.1;
          }

          100% {
              transform: scale(1);
              opacity: 0.3;
          }
      }

      h1 {
          color: var(--text-primary);
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 16px;
          letter-spacing: -0.025em;
      }

      .offline-message {
          color: var(--text-secondary);
          font-size: 1.125rem;
          margin-bottom: 32px;
          line-height: 1.7;
      }

      .action-buttons {
          display: flex;
          flex-direction: column;
          gap: 16px;
          margin-bottom: 32px;
      }

      .btn {
          padding: 14px 28px;
          border: none;
          border-radius: 12px;
          font-size: 1rem;
          font-weight: 600;
          text-transform: none;
          letter-spacing: 0.025em;
          cursor: pointer;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          position: relative;
          overflow: hidden;
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
      }

      .btn-primary {
          color: var(--text-secondary);
          background-clip: border-box;
          background-color: rgba(0, 0, 0, 0);
          background-image: linear-gradient(135deg,
                  rgb(130, 9, 211) 0px,
                  rgba(59, 130, 246, 0.8) 100%);
          box-shadow:
              rgba(59, 130, 246, 0.3) 0px 6px 20px 0px,
              rgba(0, 0, 0, 0.1) 0px 2px 4px 0px;
          border: none;
      }

      .btn-primary:hover {
          transform: translateY(-2px);
      }

      .btn-secondary {
          background: var(--surface-alt);
          color: var(--text-primary);
          border: 2px solid var(--border);
      }

      .btn-secondary:hover {
          background: var(--surface);
          border-color: var(--primary-color);
          transform: translateY(-1px);
      }

      .btn:active {
          transform: translateY(0);
      }

      .status-indicator {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: #fef3c7;
          color: #92400e;
          padding: 12px 20px;
          border-radius: 12px;
          font-size: 0.875rem;
          font-weight: 500;
          margin-bottom: 24px;
      }

      .status-dot {
          width: 8px;
          height: 8px;
          background: #f59e0b;
          border-radius: 50%;
          animation: blink 1.5s ease-in-out infinite;
      }

      @keyframes blink {

          0%,
          50% {
              opacity: 1;
          }

          51%,
          100% {
              opacity: 0.3;
          }
      }

      .site-info {
          padding-top: 24px;
          border-top: 1px solid var(--border);
          color: var(--text-secondary);
          font-size: 0.875rem;
      }

      .site-name {
          font-weight: 600;
          color: var(--text-secondary);
      }

      /* Language selector styling */
      .language-selector {
          position: absolute;
          top: 20px;
          left: 20px;
          display: flex;
          gap: 5px;
      }

      .lang-btn {
          background: var(--text-primary);
          border: 1px solid var(--border);
          color: var(--surface);
          border-radius: 8px;
          padding: 8px 12px;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          backdrop-filter: blur(10px);
      }

      .lang-btn:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow);
          border-color: var(--primary-color);
      }

      .lang-btn.active {
        color: var(--text-secondary);
        background-clip: border-box;
        background-color: rgba(0, 0, 0, 0);
        background-image: linear-gradient(135deg,
            rgb(130, 9, 211) 0px,
            rgba(59, 130, 246, 0.8) 100%);
        box-shadow:
            rgba(59, 130, 246, 0.3) 0px 6px 20px 0px,
            rgba(0, 0, 0, 0.1) 0px 2px 4px 0px;
        border: none;
      }

      /* Mobile Responsive */
      @media (max-width: 640px) {
          body {
              padding: 0 !important;
          }

          .offline-container {
              padding: 32px 24px;
              border-radius: 16px;
              margin: 8px !important;
          }

          .offline-icon {
              width: 100px;
              height: 100px;
              margin-bottom: 24px;
          }

          .offline-icon svg {
              width: 50px;
              height: 50px;
          }

          h1 {
              font-size: 1.75rem;
              margin-bottom: 12px;
          }

          .offline-message {
              font-size: 1rem;
              margin-bottom: 24px;
          }

          .btn {
              padding: 12px 24px;
              font-size: 0.95rem;
          }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
          :root {
              --text-primary: #f9fafb;
              --text-secondary: #d1d5db;
              --surface: #1f2937;
              --surface-alt: #374151;
              --border: #4b5563;
          }
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {

          .offline-icon,
          .offline-icon::after,
          .status-dot {
              animation: none;
          }

          .btn {
              transition: none;
          }
      }
    </style>
  </head>

  <body>
    <div class="language-selector">
      <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
      <button class="lang-btn" onclick="changeLanguage('pl')">PL</button>
    </div>

    <div class="offline-container">
      <div class="offline-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 3l20 18"></path>
          <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
          <path d="M2 8.82a15 18 0 0 1 9.17-3.85"></path>
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
          <path d="M5 12.859a10 10 0 0 1 12.17-1.39"></path>
          <circle cx="12" cy="20" r="1"></circle>
        </svg>
      </div>

      <div class="status-indicator">
        <div class="status-dot"></div>
        <span data-i18n="no_connection">No Internet Connection</span>
      </div>

      <h1 data-i18n="offline_title">{{OFFLINE_TITLE}}</h1>

      <p class="offline-message" data-i18n="offline_message">
        {{OFFLINE_MESSAGE}}
      </p>

      <div class="action-buttons">
        <button class="btn btn-primary" onclick="location.reload()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path
              d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"
            ></path>
          </svg>
          <span data-i18n="try_again">Try Again</span>
        </button>

        <a href="{{HOME_URL}}" class="btn btn-secondary">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9,22 9,12 15,12 15,22"></polyline>
          </svg>
          <span data-i18n="go_home">Go Home</span>
        </a>
      </div>

      <div class="site-info">
        <div class="site-name">{{SITE_NAME}}</div>
        <div>{{SITE_DESCRIPTION}}</div>
      </div>
    </div>
  </body>
</html>
