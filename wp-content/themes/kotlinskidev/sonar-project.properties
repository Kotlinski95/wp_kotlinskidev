sonar.projectKey=kotlinskidev
sonar.projectName=kotlinskidev
sonar.sources=src,functions,includes,templates,parts,patterns
sonar.exclusions=build/**,node_modules/**,vendor/**,languages/**,audit/results/**,storybook-static/**
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*.php
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info
sonar.php.coverage.reportPaths=coverage/php/clover.xml
sonar.qualitygate.wait=true
