sonar.projectKey=kotlinskidev
sonar.projectName=kotlinskidev
sonar.sources=src,functions,includes,templates,parts,patterns
sonar.exclusions=build/**,node_modules/**,vendor/**,languages/**,audit/results/**,storybook-static/**
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*.php
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info
sonar.php.coverage.reportPaths=coverage/php/clover.xml
sonar.qualitygate.wait=true

# Confirmed false positives, each individually reviewed against the real code before being
# added here (not blanket-suppressed) — see CHANGELOG.md's 2026-10-29 SonarQube triage entries
# for the full reasoning behind each one.
sonar.issue.ignore.multicriteria=sassImport,sassMixin,wpDupeId,phpHash1,phpHash2,phpHash3,ariaSprintf1,canvasAriaTs,canvasAriaPhp,decorativeRandom,nonInteractiveDiv,regexBenchmarked1,regexBenchmarked2,regexBenchmarked3

# Sass requires @use before everything else, including @import — the opposite of plain CSS's
# import-first rule. The analyzer doesn't know Sass semantics; swapping the order breaks the build.
sonar.issue.ignore.multicriteria.sassImport.ruleKey=css:S8778
sonar.issue.ignore.multicriteria.sassImport.resourceKey=**/*.scss

# `&` inside a @mixin definition has no scoping root until @include'd elsewhere — valid, idiomatic
# Sass the analyzer can't trace through mixin expansion.
sonar.issue.ignore.multicriteria.sassMixin.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.sassMixin.resourceKey=**/*.scss

# These id pairs only ever render on mutually-exclusive WP admin hooks (category_add_form_fields
# vs category_edit_form_fields) — never both on the same page.
sonar.issue.ignore.multicriteria.wpDupeId.ruleKey=Web:S7930
sonar.issue.ignore.multicriteria.wpDupeId.resourceKey=functions/blog-topic-manager.php

# md5() used only for transient cache-key derivation in these 3 files, never anything
# security-sensitive.
sonar.issue.ignore.multicriteria.phpHash1.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.phpHash1.resourceKey=functions/filters.php
sonar.issue.ignore.multicriteria.phpHash2.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.phpHash2.resourceKey=functions/certificate-badge-fetch.php
sonar.issue.ignore.multicriteria.phpHash3.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.phpHash3.resourceKey=functions/page-view-tracking.php

# The analyzer can't trace a PHP sprintf() placeholder back to its substituted value; both are
# always exactly "true"/"false" and "vertical"/"horizontal".
sonar.issue.ignore.multicriteria.ariaSprintf1.ruleKey=Web:S6793
sonar.issue.ignore.multicriteria.ariaSprintf1.resourceKey=src/blocks/content-tabs/render.php

# Bare <canvas>, no tabindex — not natively focusable, so aria-hidden is correct here.
sonar.issue.ignore.multicriteria.canvasAriaTs.ruleKey=typescript:S6825
sonar.issue.ignore.multicriteria.canvasAriaTs.resourceKey=src/blocks/canvas-background/shared/CanvasRecipePreview.tsx
sonar.issue.ignore.multicriteria.canvasAriaPhp.ruleKey=Web:S6825
sonar.issue.ignore.multicriteria.canvasAriaPhp.resourceKey=src/blocks/model-viewer/render.php

# Math.random() generates decorative canvas grain texture, not used cryptographically.
sonar.issue.ignore.multicriteria.decorativeRandom.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.decorativeRandom.resourceKey=src/scripts/canvas-background/layers/noise.ts

# Defensive onMouseDown wrapper that only calls preventDefault() to preserve editor focus —
# not meant to be a keyboard-navigable interactive control.
sonar.issue.ignore.multicriteria.nonInteractiveDiv.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.nonInteractiveDiv.resourceKey=src/formats/gradient-highlight/index.tsx

# Confirmed via direct benchmarking up to 20,000-char pathological input (flat/linear every time),
# not just trusting the static flag — see CHANGELOG. A genuinely bad regex in animated-counter.ts
# was found and fixed the same way; re-benchmark by hand before adding a new regex to these files.
sonar.issue.ignore.multicriteria.regexBenchmarked1.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.regexBenchmarked1.resourceKey=src/blocks/responsive-font-size/index.tsx
sonar.issue.ignore.multicriteria.regexBenchmarked2.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.regexBenchmarked2.resourceKey=src/scripts/active-link-state.ts
sonar.issue.ignore.multicriteria.regexBenchmarked3.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.regexBenchmarked3.resourceKey=src/scripts/animated-counter.ts
