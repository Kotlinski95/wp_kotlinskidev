<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Error - KotlinskiDev</title>
    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const systemPrefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (storedTheme === "light") {
          document.documentElement.classList.add("light-mode");
          document.documentElement.classList.remove("dark-mode");
        } else if (storedTheme === "dark") {
          document.documentElement.classList.add("dark-mode");
          document.documentElement.classList.remove("light-mode");
        } else {
          if (systemPrefersDark) {
            document.documentElement.classList.add("dark-mode");
            document.documentElement.classList.remove("light-mode");
          } else {
            document.documentElement.classList.add("light-mode");
            document.documentElement.classList.remove("dark-mode");
          }
        }
      })();

      if (window.matchMedia) {
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", function (e) {
            if (!localStorage.getItem("theme")) {
              if (e.matches) {
                document.documentElement.classList.add("dark-mode");
                document.documentElement.classList.remove("light-mode");
              } else {
                document.documentElement.classList.add("light-mode");
                document.documentElement.classList.remove("dark-mode");
              }
            }
          });
      }

      const DEFAULT_LANGUAGE = "pl";

      const translations = {
        en: {
          error_title: "Server Error",
          error_message:
            "There has been a technical issue. I'm working to resolve this issue as quickly as possible. I apologize for the inconvenience.",
          homepage_button: "Go to Homepage",
          retry_button: "Try Again",
          error_code: "Error Code",
          time: "Time",
          themeLight:
            "Switch between dark and light mode (currently light mode)",
          themeDark: "Switch between dark and light mode (currently dark mode)",
        },
        pl: {
          error_title: "Błąd Serwera",
          error_message:
            "Wystąpił problem techniczny. Pracuje nad rozwiązaniem tego problemu tak szybko, jak to możliwe. Przepraszam za niedogodności.",
          homepage_button: "Przejdź do strony głównej",
          retry_button: "Spróbuj ponownie",
          error_code: "Kod błędu",
          time: "Czas",
          themeLight:
            "Przełącz pomiędzy trybem ciemnym i jasnym (obecnie tryb jasny)",
          themeDark:
            "Przełącz pomiędzy trybem ciemnym i jasnym (obecnie tryb ciemny)",
        },
      };

      window.translations = translations;

      function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get("lang");
        if (urlLang && translations[urlLang]) {
          return urlLang;
        }

        const path = window.location.pathname;
        for (const lang in translations) {
          if (path.includes("/" + lang + "/")) {
            return lang;
          }
        }

        if (!path.includes("/en/")) {
          return DEFAULT_LANGUAGE;
        }

        const storedLang = localStorage.getItem("language");
        if (storedLang && translations[storedLang]) {
          return storedLang;
        }

        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang) {
          const langCode = browserLang.split("-")[0];
          if (translations[langCode]) {
            return langCode;
          }
        }

        return DEFAULT_LANGUAGE;
      }

      const currentLang = detectLanguage();
      document.documentElement.lang = currentLang;

      function translatePage() {
        const elements = document.querySelectorAll("[data-i18n]");
        elements.forEach((element) => {
          const key = element.getAttribute("data-i18n");
          if (translations[currentLang] && translations[currentLang][key]) {
            element.textContent = translations[currentLang][key];
          }
        });
      }

      document.addEventListener("DOMContentLoaded", translatePage);

      function setBackgroundImage() {
        const currentUrl = window.location.href;
        let basePath = "";

        if (currentUrl.includes("/adriankotlinski/")) {
          basePath =
            window.location.protocol +
            "//" +
            window.location.host +
            "/adriankotlinski/wp-content/themes/kotlinskidev/assets/images/kotlinskidev-logo.webp";
        } else {
          basePath =
            window.location.protocol +
            "//" +
            window.location.host +
            "/wp-content/themes/kotlinskidev/assets/images/kotlinskidev-logo.webp";
        }

        document.body.style.backgroundImage = `url('${basePath}')`;
        document.body.style.opacity = "1";

        const backgroundOverlay = document.createElement("div");
        backgroundOverlay.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-image: url('${basePath}');
          background-repeat: space;
          background-position: top left;
          background-size: 10%;
          opacity: 0.2;
          pointer-events: none;
          z-index: -1;
          filter: invert(15%);
        `;
        backgroundOverlay?.classList?.add("body-overlay");
        document.body.appendChild(backgroundOverlay);

        document.body.style.backgroundImage = "none";
      }

      document.addEventListener("DOMContentLoaded", setBackgroundImage);
    </script>
    <style>
      :root {
        --shadow-color: rgba(0, 0, 0, 0.1);
        --border-color: #e5e7eb;
        --error-color: #dc3545;
        --color-primary: #9b51e0;
        --color-primary-rgb: 59, 130, 246;
      }

      .light-mode {
        --bg-main: #ffffff;
        --bg-card: #ffffff;
        --color-text: #000000;
        --color-text-secondary: #666666;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --border-color: #e5e7eb;
        --details-bg: #f1f5f9;
      }

      .dark-mode {
        --bg-main: #000000;
        --bg-card: #1a1a1a;
        --color-text: #ffffff;
        --color-text-secondary: #9ca3af;
        --shadow-color: rgba(0, 0, 0, 0.25);
        --border-color: #4b5563;
        --details-bg: #374151;
        --color-primary: #9b51e0;
        --color-primary-rgb: 96, 165, 250;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Sora",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
        background: var(--bg-main);
        color: var(--color-text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
        background-repeat: repeat;
        background-position: top left;
        background-size: 15%;
        background-attachment: scroll;
        position: relative;
      }

      .error-container {
        max-width: 37.5rem;
        text-align: center;
        background: var(--bg-card);
        padding: 3rem 2rem;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 2rem var(--shadow-color);
        transition:
          background-color 0.3s ease,
          box-shadow 0.3s ease;
        border: 0.0625rem solid var(--border-color);
      }

      .error-icon {
        font-size: 5rem;
        margin-bottom: 2rem;
        color: var(--error-color);
        transition: color 0.3s ease;
      }

      .error-title {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--color-text);
        transition: color 0.3s ease;
      }

      .error-message {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        color: var(--color-text-secondary);
        line-height: 1.6;
        transition: color 0.3s ease;
      }

      .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 6.25rem;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        border: none;
        justify-content: center;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          rgb(130, 9, 211) 0rem,
          rgba(59, 130, 246, 0.8) 100%
        );
        color: white;
        box-shadow: 0 0.25rem 0.75rem rgba(var(--color-primary-rgb), 0.25);
      }

      .btn-secondary {
        background: transparent;
        color: var(--color-primary);
        border: 0.125rem solid var(--color-primary);
        transition:
          color 0.3s ease,
          border-color 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-0.125rem);
        box-shadow: 0 0.5rem 1.25rem rgba(var(--color-primary-rgb), 0.3);
      }

      .error-details {
        margin-top: 2rem;
        padding: 1rem;
        background: var(--details-bg);
        border-radius: 0.5rem;
        font-size: 0.9rem;
        color: var(--color-text-secondary);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      @media (max-width: 37.5rem) {
        .error-title {
          font-size: 2rem;
        }

        .error-container {
          padding: 2rem 1.5rem;
          margin-top: 3rem;
        }

        .error-actions {
          flex-direction: column;
        }
      }

      .theme-switcher {
        display: flex;
        flex-direction: column;
        z-index: 1001;
        margin-inline-end: -1rem;
        position: absolute;
        top: 1.25rem;
        right: 2.5rem;
      }
      .theme-switcher p:empty,
      .theme-switcher br {
        display: none;
      }
      .theme-switcher .title {
        text-align: center;
      }
      .theme-switcher .content {
        text-align: justify;
      }
      .theme-switcher input[type="checkbox"] {
        display: none;
      }
      .theme-switcher .icon {
        display: flex;
        font-size: 2rem;
        width: 2rem;
        height: 2rem;
        border-radius: 100%;
        padding: 0.1875rem;
        cursor: pointer;
        align-items: center;
      }
      .theme-switcher .icon svg {
        width: 2rem;
        height: 2rem;
      }
      .theme-switcher .icon.light {
        display: none;
      }
      .theme-switcher .icon:focus,
      .theme-switcher .icon:hover {
        background: rgba(242, 242, 242, 0.1);
      }
      .light-mode .theme-switcher .icon.dark {
        display: none;
      }
      .light-mode .theme-switcher .icon.light {
        display: flex;
      }
      .light-mode .theme-switcher .icon:focus,
      .light-mode .theme-switcher .icon:hover {
        background: rgba(19, 19, 19, 0.2);
      }

      .language-selector {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        display: flex;
        gap: 0.3125rem;
      }

      .lang-btn {
        background: var(--bg-card);
        border: 0.0625rem solid var(--border-color);
        color: var(--color-text);
        border-radius: 0.25rem;
        padding: 0.375rem 0.625rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        transform: translateY(-0.125rem);
        box-shadow: 0 0.25rem 0.5rem var(--shadow-color);
      }

      .lang-btn.active {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <div class="language-selector">
      <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
      <button class="lang-btn" onclick="changeLanguage('pl')">PL</button>
    </div>

    <div class="theme-switcher">
      <input type="checkbox" name="check" id="theme-toggle" />
      <label for="theme-toggle">
        <span class="wrapper">
          <span class="icon light" data-theme-icon="light">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              class="lightToggleIcon_pyhR"
            >
              <path
                fill="currentColor"
                d="M12,9c1.65,0,3,1.35,3,3s-1.35,3-3,3s-3-1.35-3-3S10.35,9,12,9 M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5 S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1 s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1C11.45,19,11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0 c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95 c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41 L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41 s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06 c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"
              ></path>
            </svg>
          </span>
          <span class="icon dark" data-theme-icon="dark">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              class="darkToggleIcon_wfgR"
            >
              <path
                fill="currentColor"
                d="M9.37,5.51C9.19,6.15,9.1,6.82,9.1,7.5c0,4.08,3.32,7.4,7.4,7.4c0.68,0,1.35-0.09,1.99-0.27C17.45,17.19,14.93,19,12,19 c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36 c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"
              ></path>
            </svg>
          </span>
        </span>
      </label>
    </div>

    <div class="error-container">
      <div class="error-icon">⚠️</div>
      <h1 class="error-title" data-i18n="error_title">Server Error</h1>
      <p class="error-message" data-i18n="error_message">
        We're experiencing technical difficulties. Our team has been notified
        and is working to resolve this issue as quickly as possible.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          🏠 <span data-i18n="homepage_button">Go to Homepage</span>
        </a>
        <button onclick="location.reload()" class="btn btn-secondary">
          🔄 <span data-i18n="retry_button">Try Again</span>
        </button>
      </div>

      <div class="error-details">
        <strong><span data-i18n="error_code">Error Code</span>:</strong> 500 -
        Internal Server Error<br />
        <strong><span data-i18n="time">Time</span>:</strong>
        <script>
          document.write(new Date().toLocaleString(currentLang));
        </script>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const themeToggleButton = document.getElementById("theme-toggle");
        const lightIcon = document.querySelector(".icon.light");
        const darkIcon = document.querySelector(".icon.dark");
        if (!themeToggleButton) return;

        const updateIconTitles = (isLightMode) => {
          if (lightIcon && darkIcon) {
            if (isLightMode) {
              lightIcon.setAttribute(
                "title",
                translations[document.documentElement.lang].themeLight
              );
              darkIcon.removeAttribute("title");
            } else {
              darkIcon.setAttribute(
                "title",
                translations[document.documentElement.lang].themeDark
              );
              lightIcon.removeAttribute("title");
            }
          }
        };

        const applyLightTheme = () => {
          document.documentElement.classList.add("light-mode");
          document.documentElement.classList.remove("dark-mode");
          document.body.classList.add("light-mode");
          document.body.classList.remove("dark-mode");
          themeToggleButton.checked = true;
          updateIconTitles(true);
        };

        const applyDarkTheme = () => {
          document.documentElement.classList.add("dark-mode");
          document.documentElement.classList.remove("light-mode");
          document.body.classList.add("dark-mode");
          document.body.classList.remove("light-mode");
          themeToggleButton.checked = false;
          updateIconTitles(false);
        };

        if (document.documentElement.classList.contains("light-mode")) {
          themeToggleButton.checked = true;
        } else {
          themeToggleButton.checked = false;
        }

        const storedTheme = localStorage.getItem("theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        if (storedTheme === "light") {
          applyLightTheme();
        } else if (storedTheme === "dark") {
          applyDarkTheme();
        } else {
          if (systemPrefersDark) {
            applyDarkTheme();
          } else {
            applyLightTheme();
          }
        }

        themeToggleButton.addEventListener("change", function () {
          if (this.checked) {
            applyLightTheme();
            localStorage.setItem("theme", "light");
          } else {
            applyDarkTheme();
            localStorage.setItem("theme", "dark");
          }
        });

        let activeLang = document.documentElement.lang || "en";

        function updateLanguageButtons() {
          const buttons = document.querySelectorAll(".lang-btn");
          buttons.forEach((btn) => {
            const lang = btn.getAttribute("onclick").split("'")[1];
            if (lang === activeLang) {
              btn.classList.add("active");
            } else {
              btn.classList.remove("active");
            }
          });
        }

        updateLanguageButtons();

        window.changeLanguage = function (lang) {
          if (translations[lang]) {
            localStorage.setItem("language", lang);
            document.documentElement.lang = lang;
            activeLang = lang;

            const elements = document.querySelectorAll("[data-i18n]");
            elements.forEach((element) => {
              const key = element.getAttribute("data-i18n");
              if (translations[lang][key]) {
                element.textContent = translations[lang][key];
              }
            });

            const timeElement = document.querySelector(".error-details script");
            if (timeElement) {
              const now = new Date();
              const timeDisplay = document.createTextNode(
                now.toLocaleString(lang)
              );
              timeElement.parentNode.replaceChild(timeDisplay, timeElement);
            }

            updateLanguageButtons();
            if (storedTheme === "light") {
              applyLightTheme();
            } else if (storedTheme === "dark") {
              applyDarkTheme();
            }
          }
        };
      });
    </script>
  </body>
</html>
