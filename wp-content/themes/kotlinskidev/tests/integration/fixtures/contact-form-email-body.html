<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Contact Form Submission</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      background: #fff;
      color: #181A1B;
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
    }
    .container {
      max-width: 30rem;
      margin: 2rem auto;
      background: #f3f4f6;
      border-radius: 0.75rem;
      box-shadow: 0 0.125rem 0.75rem #0001;
      padding: 2rem 1.5rem;
    }
    h2 { color: #2563eb; margin-top: 0; }
    .field { margin-bottom: 1.125rem; }
    .label {
      color: #52525B;
      font-size: .8125rem;
      letter-spacing: .0625rem;
      text-transform: uppercase;
      margin-bottom: .25rem;
      display: block;
    }
    .value { color: #181A1B; font-size: 1rem; font-weight: 500; }
    .footer { margin-top: 2rem; color: #A1A1AA; font-size: 0.75rem; text-align: center; }
    @media (prefers-color-scheme: dark) {
      body { background: #181A1B; color: #F3F4F6; }
      .container { background: #23272A; box-shadow: 0 0.125rem 0.75rem #0008; }
      h2 { color: #7DD3FC; }
      .label { color: #A1A1AA; }
      .value { color: #F3F4F6; }
      .footer { color: #52525B; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>New Contact Form Message</h2>
    <div class="field"><span class="label">Name</span><span class="value">Jane Doe</span></div>
    <div class="field"><span class="label">Email</span><span class="value">jane@example.com</span></div>
    <div class="field"><span class="label">Topic</span><span class="value">Pricing &amp; scope</span></div>
    <div class="field"><span class="label">Message</span><div class="value" style="white-space:pre-line;">Line one x<br />
Line two</div></div>
    <div class="field"><span class="label">Agreed</span><span class="value">Yes</span></div>
    <div class="footer">Contact Form &bull; DATE</div>
  </div>
</body>
</html>
